name: Deploy Local (self-hosted, opt-in)

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "40-char commit SHA to deploy"
        required: true
        type: string
        pattern: "^[0-9a-f]{40}$"

# VERTWOPLAN §18.3 — opt-in; requires self-hosted Windows runner with docker/minikube/kubectl
# Public-repo safeguard: this is the ONLY workflow that uses self-hosted (see §17).

permissions:
  contents: read

concurrency:
  group: deploy-local
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64, docker, minikube]
    environment: local-minikube
    steps:
      - name: Validate SHA format
        shell: bash
        run: |
          if ! [[ "${{ inputs.sha }}" =~ ^[0-9a-f]{40}$ ]]; then echo "::error::SHA must be 40 hex chars"; exit 1; fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify SHA is ancestor of origin/main
        shell: bash
        run: |
          git fetch origin --prune
          if ! git merge-base --is-ancestor "${{ inputs.sha }}" origin/main; then
            echo "::error::${{ inputs.sha }} is not ancestor of origin/main"
            exit 1
          fi
          git checkout --force "${{ inputs.sha }}"
          echo "checked out $GITHUB_SHA"
      - name: Verify CI passed for SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Require all 4 CI checks succeeded for this SHA (prefix match — job names include description)
          for i in 1 2 3 4 5 6; do
            STATUS=$(gh api repos/${{ github.repository }}/commits/${{ inputs.sha }}/check-runs --jq '[.check_runs[] | select(.name|test("^(api-tests|pipeline-tests|ui-build|container-validation)")) | .conclusion] | unique | join(",")' 2>/dev/null || echo "")
            echo "check conclusions: $STATUS"
            if echo "$STATUS" | grep -q "success" && ! echo "$STATUS" | grep -qE "failure|cancelled|timed_out"; then
              COUNT=$(gh api repos/${{ github.repository }}/commits/${{ inputs.sha }}/check-runs --jq '[.check_runs[] | select(.name|test("^(api-tests|pipeline-tests|ui-build|container-validation)"))] | length' 2>/dev/null || echo 0)
              if [[ "$COUNT" -ge 4 ]]; then echo "CI green for $COUNT checks"; break; fi
            fi
            sleep 10
            if [[ $i -eq 6 ]]; then echo "::error::CI not green for ${{ inputs.sha }}"; exit 1; fi
          done
      - name: Stage protected .env
        shell: bash
        run: |
          SRC="${MLOPS_ENV_FILE:-C:/Users/LENOVO/.mlops-deploy/platform.env}"
          echo "staging .env from $SRC"
          if [[ ! -f "$SRC" ]]; then echo "::error::MLOPS_ENV_FILE not found: $SRC"; exit 1; fi
          cp "$SRC" .env
          # Never log contents
          echo ".env staged (not logged)"
      - name: Deploy via scripts/deploy-local.sh
        shell: bash
        run: bash scripts/deploy-local.sh "${{ inputs.sha }}"
      - name: Cleanup staged .env (always)
        if: always()
        shell: bash
        run: |
          rm -f .env 2>/dev/null || true
          echo "cleaned staged .env"
